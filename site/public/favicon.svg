<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Horse head from FACE_ROWS in site/src/horse-face.ts, cropped to the head
       (the last two rows are shoulder and read as a stray limb at icon size)
       and scaled 2x so each art pixel lands on a whole device pixel. -->
  <rect width="16" height="16" fill="#1a1229"/>
  <rect x="4" y="0" width="6" height="2" fill="#f5e9d3"/>
  <rect x="4" y="2" width="6" height="2" fill="#f5e9d3"/>
  <rect x="2" y="4" width="2" height="2" fill="#f5e9d3"/>
  <rect x="4" y="4" width="4" height="2" fill="#8B4513"/>
  <rect x="8" y="4" width="2" height="2" fill="#000000"/>
  <rect x="10" y="4" width="4" height="2" fill="#8B4513"/>
  <rect x="2" y="6" width="2" height="2" fill="#f5e9d3"/>
  <rect x="4" y="6" width="4" height="2" fill="#8B4513"/>
  <rect x="8" y="6" width="2" height="2" fill="#000000"/>
  <rect x="10" y="6" width="4" height="2" fill="#8B4513"/>
  <rect x="0" y="8" width="2" height="2" fill="#f5e9d3"/>
  <rect x="2" y="8" width="14" height="2" fill="#8B4513"/>
  <rect x="0" y="10" width="2" height="2" fill="#f5e9d3"/>
  <rect x="2" y="10" width="14" height="2" fill="#8B4513"/>
  <rect x="0" y="12" width="2" height="2" fill="#f5e9d3"/>
  <rect x="2" y="12" width="6" height="2" fill="#8B4513"/>
  <rect x="0" y="14" width="2" height="2" fill="#f5e9d3"/>
  <rect x="2" y="14" width="6" height="2" fill="#8B4513"/>
</svg>
