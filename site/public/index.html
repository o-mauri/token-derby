<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Token Derby</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&family=Bitcount+Prop+Single:wght@100..900&family=VT323&display=swap">
    <link rel="stylesheet" href="/styles.css">
    <!-- Apply the stored theme before first paint so there's no flash of Derby.
         Deliberately duplicated from src/theme.ts (which is deferred as a module);
         keep the key and the id list in sync with THEME_STORAGE_KEY / THEMES. -->
    <script>
      try {
        var t = localStorage.getItem('td_theme');
        if (['derby', 'midnight', 'turf', 'photo', 'chromatic', 'matrix'].indexOf(t) !== -1) {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) { /* storage blocked — fall through to the :root default */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
