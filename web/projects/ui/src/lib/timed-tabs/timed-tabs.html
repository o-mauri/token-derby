<div class="tablist" role="tablist" (keydown)="onKey($event)">
  @for (tab of tabs(); track $index; let i = $index) {
    <button #tab type="button" role="tab" class="tab" [id]="id + '-tab-' + i"
      [attr.aria-selected]="i === selected()" [attr.aria-controls]="id + '-panel'" [attr.tabindex]="i === selected() ? 0 : -1"
      [style.--progress]="i === selected() ? progress() : 0" (click)="select(i)">
      <span class="text">{{ tab.label() }}</span>
      <span class="timer" aria-hidden="true"></span>
    </button>
  }
</div>
<div class="panel" role="tabpanel" [id]="id + '-panel'" [attr.aria-labelledby]="id + '-tab-' + selected()"
  (pointerdown)="pointerDown($event)" (pointerup)="pointerUp($event)">
  @if (active(); as tab) { <ng-container [ngTemplateOutlet]="tab.template" /> }
</div>
