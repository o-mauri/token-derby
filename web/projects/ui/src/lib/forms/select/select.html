@if (label()) { <span class="label" [class.sr-only]="hideLabel()" [id]="id">{{ label() }}</span> }
<button #trigger type="button" class="trigger" cdkOverlayOrigin #origin="cdkOverlayOrigin" [id]="triggerId"
  aria-haspopup="listbox" [attr.aria-expanded]="open()"
  [attr.aria-labelledby]="label() ? id + ' ' + triggerId : null"
  [attr.aria-invalid]="visibleErrors().length > 0" [disabled]="disabled()"
  (click)="toggle()" (keydown)="onTriggerKey($event)">
  <span class="labels">
    <span class="current" [class.placeholder]="!selectedLabel()">{{ selectedLabel() ?? placeholder() }}</span>
    <!-- Every label in the same cell, unseen, so the trigger is always as wide as the longest. -->
    <span class="sizer" aria-hidden="true">@for (o of options(); track o.value) { <span>{{ o.label }}</span> }</span>
  </span>
  <span class="caret" aria-hidden="true">▾</span>
</button>
<ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="origin" [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions" cdkConnectedOverlayMatchWidth
  (overlayOutsideClick)="dismiss()" (overlayKeydown)="onOverlayKey($event)">
  <div class="menu" cdkListbox [cdkListboxValue]="selected()" [attr.aria-labelledby]="label() ? id : null"
    (cdkListboxValueChange)="choose($event)">
    @for (o of options(); track o.value) {
      <div class="option" [cdkOption]="o.value">{{ o.label }}</div>
    }
  </div>
</ng-template>
@for (e of visibleErrors(); track $index) { <p class="error">{{ e }}</p> }
