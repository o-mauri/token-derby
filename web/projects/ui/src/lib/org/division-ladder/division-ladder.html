<ol class="ladder">
  @for (d of value().divisions; track $index; let i = $index; let last = $last) {
    <li class="division">
      <span class="rank">{{ i + 1 }}</span>
      <td-text-input class="name" hideLabel [label]="'Division ' + (i + 1) + ' name'" [value]="d.name" (valueChange)="rename(i, $event)" />
      @if (last) {
        <span class="no-cap">no cap</span>
      } @else {
        <td-text-input class="cap" type="number" hideLabel [label]="d.name + ' cap'" [value]="shown(d.cap)" (valueChange)="setCap(i, $event)" />
      }
      <button type="button" class="remove" [attr.aria-label]="'Remove ' + d.name" [disabled]="value().divisions.length < 2" (click)="remove(i)">✕</button>
    </li>
    @if (!last) {
      <li class="swap" aria-label="Swap between divisions">
        <span class="up" aria-hidden="true">▲</span> swap
        <td-text-input class="boundary" type="number" hideLabel [label]="'Horses swapping between ' + d.name + ' and the division below'"
          [value]="shown(value().boundaries[i])" (valueChange)="setSwap(i, $event)" />
        each season <span class="down" aria-hidden="true">▼</span>
      </li>
    }
  }
</ol>
<button type="button" class="add" (click)="add()">+ Add division</button>
<p class="summary">{{ summary() }}</p>
@if (error(); as message) { <p class="error" role="alert">{{ message }}</p> }
