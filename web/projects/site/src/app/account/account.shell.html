<header class="top">
  <span class="crumb">
    <td-horse-face class="face" />
    <span class="who">{{ session.signedIn() ? name() : 'TOKEN DERBY' }}</span><span class="sep">/</span><span class="here">ACCOUNT</span>
  </span>
  <span class="actions">
    @if (session.signedIn()) {
      <td-account-menu [name]="name()" [accountLink]="['/account']" (signOut)="signOut()" />
    }
    <td-theme-picker compact />
    <a td-button size="sm" routerLink="/">← Home</a>
  </span>
</header>

@if (session.signedIn()) {
  <td-tabs label="Account" [tabs]="tabs" />
  <main class="tab"><router-outlet /></main>
} @else {
  <main class="signin">
    <p>Sign in to see your account</p>
    <td-google-button [href]="signInHref()" />
  </main>
}
